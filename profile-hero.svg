<svg xmlns="http://www.w3.org/2000/svg"
     width="1180"
     height="480"
     viewBox="0 0 1180 480"
     fill="none">

  <defs>

    <!-- ===================================================== -->
    <!-- PALETTE -->
    <!-- ===================================================== -->

    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5EFE0"/>
      <stop offset="42%" stop-color="#D4960F"/>
      <stop offset="100%" stop-color="#9B6507"/>
      <animate
        attributeName="x1"
        values="0;1;0"
        dur="8s"
        repeatCount="indefinite"/>
      <animate
        attributeName="x2"
        values="1;0;1"
        dur="8s"
        repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="halo">
      <stop offset="0%" stop-color="#D4960F" stop-opacity=".22"/>
      <stop offset="45%" stop-color="#C8820A" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#C8820A" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171510"/>
      <stop offset="100%" stop-color="#0F0E0C"/>
    </linearGradient>

    <pattern id="grid"
             width="32"
             height="32"
             patternUnits="userSpaceOnUse">
      <path
        d="M32 0H0V32"
        stroke="#F5EFE0"
        stroke-opacity=".022"
        stroke-width="1"/>
    </pattern>

    <filter id="glow"
            x="-150%"
            y="-150%"
            width="400%"
            height="400%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow"
            x="-150%"
            y="-150%"
            width="400%"
            height="400%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

    <clipPath id="clip">
      <rect width="1180" height="480" rx="24"/>
    </clipPath>

  </defs>

  <!-- ===================================================== -->
  <!-- OUTER FRAME -->
  <!-- ===================================================== -->

  <rect
    width="1180"
    height="480"
    rx="24"
    fill="#0E0D0B"/>

  <rect
    x="1"
    y="1"
    width="1178"
    height="478"
    rx="23"
    stroke="#F5EFE0"
    stroke-opacity=".09"/>

  <rect
    x="20"
    y="20"
    width="1140"
    height="440"
    rx="18"
    fill="url(#grid)"/>

  <!-- ===================================================== -->
  <!-- AMBIENT LIGHT -->
  <!-- ===================================================== -->

  <circle
    cx="295"
    cy="245"
    r="210"
    fill="url(#halo)"
    opacity=".55">

    <animate
      attributeName="opacity"
      values=".25;.58;.25"
      dur="6s"
      repeatCount="indefinite"/>
  </circle>

  <circle
    cx="900"
    cy="220"
    r="190"
    fill="url(#halo)"
    opacity=".16">

    <animate
      attributeName="opacity"
      values=".08;.20;.08"
      dur="7s"
      repeatCount="indefinite"/>
  </circle>

  <!-- ===================================================== -->
  <!-- TOP META -->
  <!-- ===================================================== -->

  <text
    x="48"
    y="48"
    font-family="monospace"
    font-size="10"
    letter-spacing="3"
    fill="#746B5F">
    01 / PERSONAL PROFILE
  </text>

  <text
    x="1132"
    y="48"
    text-anchor="end"
    font-family="monospace"
    font-size="10"
    letter-spacing="2"
    fill="#4E483F">
    GPRANIT16 / GITHUB
  </text>

  <!-- ===================================================== -->
  <!-- LEFT IDENTITY PANEL -->
  <!-- ===================================================== -->

  <rect
    x="46"
    y="72"
    width="500"
    height="350"
    rx="18"
    fill="#12110F"
    stroke="#F5EFE0"
    stroke-opacity=".07"/>

  <text
    x="72"
    y="108"
    font-family="monospace"
    font-size="10"
    letter-spacing="3"
    fill="#C8820A">
    // IDENTITY
  </text>

  <text
    x="520"
    y="108"
    text-anchor="end"
    font-family="monospace"
    font-size="9"
    letter-spacing="2"
    fill="#504A40">
    PK / 01
  </text>

  <line
    x1="72"
    y1="124"
    x2="520"
    y2="124"
    stroke="#F5EFE0"
    stroke-opacity=".06"/>

  <!-- ===================================================== -->
  <!-- ABSTRACT PK MARK -->
  <!-- ===================================================== -->

  <!-- orbit -->
  <ellipse
    cx="292"
    cy="245"
    rx="128"
    ry="88"
    stroke="#C8820A"
    stroke-opacity=".13"
    stroke-width="1"
    transform="rotate(-18 292 245)"/>

  <ellipse
    cx="292"
    cy="245"
    rx="92"
    ry="124"
    stroke="#F5EFE0"
    stroke-opacity=".06"
    stroke-width="1"
    transform="rotate(28 292 245)"/>

  <!-- outer nodes -->
  <circle
    cx="168"
    cy="210"
    r="3"
    fill="#C8820A"
    filter="url(#glow)"/>

  <circle
    cx="408"
    cy="182"
    r="3"
    fill="#C8820A"/>

  <circle
    cx="424"
    cy="307"
    r="3"
    fill="#D4960F"/>

  <circle
    cx="204"
    cy="336"
    r="3"
    fill="#C8820A"/>

  <!-- PK monogram -->
  <g
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="700"
    fill="url(#amber)"
    text-anchor="middle">

    <text
      x="260"
      y="285"
      font-size="132"
      letter-spacing="-20">
      PK
    </text>

  </g>

  <!-- subtle crosshair -->
  <line
    x1="292"
    y1="145"
    x2="292"
    y2="345"
    stroke="#C8820A"
    stroke-opacity=".07"/>

  <line
    x1="174"
    y1="245"
    x2="410"
    y2="245"
    stroke="#C8820A"
    stroke-opacity=".06"/>

  <!-- moving orbit point -->
  <circle
    cx="164"
    cy="217"
    r="4"
    fill="#F0C36A"
    filter="url(#glow)">

    <animateMotion
      dur="5s"
      repeatCount="indefinite"
      path="M0,0 C45,-85 180,-110 265,-35 C330,20 290,110 155,125 C35,140 -35,65 0,0"/>
  </circle>

  <!-- identity footer -->
  <text
    x="72"
    y="382"
    font-family="monospace"
    font-size="10"
    letter-spacing="2"
    fill="#5A5248">
    PRANIT KUMAR · AI ENGINEER
  </text>

  <text
    x="520"
    y="382"
    text-anchor="end"
    font-family="monospace"
    font-size="10"
    letter-spacing="2"
    fill="#5A5248">
    FULL-STACK DEVELOPER
  </text>

  <!-- ===================================================== -->
  <!-- CENTER DIVIDER -->
  <!-- ===================================================== -->

  <line
    x1="568"
    y1="72"
    x2="568"
    y2="422"
    stroke="#C8820A"
    stroke-opacity=".18"/>

  <circle
    cx="568"
    cy="172"
    r="3"
    fill="#C8820A"
    filter="url(#glow)">

    <animate
      attributeName="r"
      values="3;5;3"
      dur="2.6s"
      repeatCount="indefinite"/>
  </circle>

  <!-- ===================================================== -->
  <!-- RIGHT TERMINAL -->
  <!-- ===================================================== -->

  <rect
    x="592"
    y="72"
    width="542"
    height="350"
    rx="18"
    fill="url(#panel)"
    stroke="#F5EFE0"
    stroke-opacity=".08"/>

  <!-- terminal header -->
  <rect
    x="592"
    y="72"
    width="542"
    height="46"
    rx="18"
    fill="#15130F"/>

  <line
    x1="592"
    y1="118"
    x2="1134"
    y2="118"
    stroke="#F5EFE0"
    stroke-opacity=".06"/>

  <circle
    cx="620"
    cy="95"
    r="4"
    fill="#C8820A"
    filter="url(#glow)">

    <animate
      attributeName="opacity"
      values="1;.45;1"
      dur="2.2s"
      repeatCount="indefinite"/>
  </circle>

  <circle
    cx="634"
    cy="95"
    r="4"
    fill="#F5EFE0"
    fill-opacity=".12"/>

  <circle
    cx="648"
    cy="95"
    r="4"
    fill="#F5EFE0"
    fill-opacity=".06"/>

  <text
    x="686"
    y="100"
    font-family="monospace"
    font-size="10"
    letter-spacing="2"
    fill="#82786A">
    PRANIT / SYSTEM
  </text>

  <text
    x="1108"
    y="100"
    text-anchor="end"
    font-family="monospace"
    font-size="9"
    letter-spacing="2"
    fill="#514A40">
    ONLINE / BUILDING
  </text>

  <!-- ===================================================== -->
  <!-- TERMINAL DATA -->
  <!-- ===================================================== -->

  <g font-family="'Courier New', monospace">

    <text
      x="620"
      y="148"
      font-size="12"
      font-weight="700"
      fill="#C8820A">
      $ whoami
    </text>

    <text
      x="620"
      y="176"
      font-size="19"
      font-weight="700"
      fill="#F5EFE0">
      pranit-kumar
    </text>

    <!-- row 1 -->
    <g opacity="0">
      <text x="620" y="208" font-size="10"
            letter-spacing="2" fill="#5C554B">
        ROLE
      </text>

      <text x="718" y="208" font-size="12" fill="#F5EFE0">
        AI Engineer × Full-Stack Developer
      </text>

      <animate attributeName="opacity"
               values="0;1"
               begin=".45s"
               dur=".4s"
               fill="freeze"/>
    </g>

    <!-- row 2 -->
    <g opacity="0">
      <text x="620" y="237" font-size="10"
            letter-spacing="2" fill="#5C554B">
        FOCUS
      </text>

      <text x="718" y="237" font-size="12" fill="#D4960F">
        Agentic AI · RAG / CRAG · Machine Learning
      </text>

      <animate attributeName="opacity"
               values="0;1"
               begin=".85s"
               dur=".4s"
               fill="freeze"/>
    </g>

    <!-- row 3 -->
    <g opacity="0">
      <text x="620" y="266" font-size="10"
            letter-spacing="2" fill="#5C554B">
        STACK
      </text>

      <text x="718" y="266" font-size="12" fill="#C8BFA8">
        Python · React · FastAPI · PostgreSQL
      </text>

      <animate attributeName="opacity"
               values="0;1"
               begin="1.25s"
               dur=".4s"
               fill="freeze"/>
    </g>

    <!-- row 4 -->
    <g opacity="0">
      <text x="620" y="295" font-size="10"
            letter-spacing="2" fill="#5C554B">
        BUILDING
      </text>

      <text x="718" y="295" font-size="12"
            font-weight="700"
            fill="#C8820A">
        TARK AI · SYNCORA · CHURN REAPER
      </text>

      <animate attributeName="opacity"
               values="0;1"
               begin="1.65s"
               dur=".4s"
               fill="freeze"/>
    </g>

    <line
      x1="620"
      y1="319"
      x2="1106"
      y2="319"
      stroke="#F5EFE0"
      stroke-opacity=".06"/>

    <!-- status -->
    <g opacity="0">

      <text
        x="620"
        y="348"
        font-size="12"
        fill="#C8820A">
        $
      </text>

      <text
        x="642"
        y="348"
        font-size="12"
        fill="#C8BFA8">
        building the next system
      </text>

      <rect
        x="642"
        y="357"
        width="7"
        height="13"
        fill="#C8820A">

        <animate
          attributeName="opacity"
          values="1;0;1"
          dur="1s"
          repeatCount="indefinite"/>
      </rect>

      <animate
        attributeName="opacity"
        values="0;1"
        begin="2.1s"
        dur=".5s"
        fill="freeze"/>
    </g>

    <!-- tiny graph -->
    <g opacity=".65">

      <line x1="884" y1="384"
            x2="946" y2="368"
            stroke="#C8820A"
            stroke-opacity=".16"/>

      <line x1="946" y1="368"
            x2="1017" y2="385"
            stroke="#C8820A"
            stroke-opacity=".16"/>

      <circle cx="884" cy="384" r="3"
              fill="#C8820A"/>

      <circle cx="946" cy="368" r="3.5"
              fill="#D4960F"
              filter="url(#glow)"/>

      <circle cx="1017" cy="385" r="3"
              fill="#C8820A"/>

    </g>

  </g>

  <!-- ===================================================== -->
  <!-- BOTTOM -->
  <!-- ===================================================== -->

  <line
    x1="46"
    y1="445"
    x2="1134"
    y2="445"
    stroke="#F5EFE0"
    stroke-opacity=".05"/>

  <rect
    x="46"
    y="444"
    width="190"
    height="2"
    rx="1"
    fill="url(#amber)"
    opacity=".7">

    <animate
      attributeName="x"
      values="46;900;46"
      dur="9s"
      repeatCount="indefinite"/>

    <animate
      attributeName="opacity"
      values=".15;.75;.15"
      dur="9s"
      repeatCount="indefinite"/>
  </rect>

  <text
    x="46"
    y="466"
    font-family="monospace"
    font-size="9"
    letter-spacing="2"
    fill="#4F483F">
    BUILD · SHIP · IMPROVE · REPEAT
  </text>

  <text
    x="1134"
    y="466"
    text-anchor="end"
    font-family="monospace"
    font-size="9"
    letter-spacing="2"
    fill="#4F483F">
    BENGALURU · INDIA
  </text>

  <!-- subtle moving scanline -->
  <rect
    x="0"
    y="-4"
    width="1180"
    height="2"
    fill="#D4960F"
    fill-opacity=".055"
    clip-path="url(#clip)">

    <animate
      attributeName="y"
      values="-4;484"
      dur="10s"
      repeatCount="indefinite"/>
  </rect>

</svg>
